<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>r/Feed — your subreddit reader</title>
<meta name="description" content="A clean RSS reader for your favorite subreddits.">
<meta name="theme-color" content="#0f1115" id="meta-theme-color">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%B0%3C/text%3E%3C/svg%3E">
<script>/* apply saved theme before paint */try{var t=localStorage.getItem("rf.theme.v1");var eff=(t==="light"||t==="dark")?t:(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",eff);}catch(e){}</script>
<link rel="stylesheet" href="style.css?v=6">
<meta property="og:title" content="r/Feed Subreddit Reader" />
<meta property="og:description" content="A clean live feed reader for your favorite subreddits via Reddit RSS." />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary" /></head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">📰</span><span class="brand-name">r/Feed</span><span class="brand-sub" id="refresh-state" title="">loading…</span></div>
  <div class="topbar-actions">
    <div class="search-box">
      <input id="search-input" type="search" placeholder="Search titles…" aria-label="Search posts" autocomplete="off" spellcheck="false">
      <button id="search-clear" class="search-clear" aria-label="Clear search">×</button>
    </div>
    <select id="sort-select" aria-label="Sort order">
      <option value="hot">Hot</option>
      <option value="new">New</option>
      <option value="rising">Rising</option>
      <option value="top">Top · day</option>
      <option value="top-week">Top · week</option>
      <option value="top-month">Top · month</option>
      <option value="top-year">Top · year</option>
      <option value="controversial">Controversial</option>
    </select>
    <button id="mark-read" class="icon-btn" title="Mark all as read" aria-label="Mark all as read">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </button>
    <button id="theme-btn" class="icon-btn" aria-label="Switch to light theme"></button>
    <button id="refresh-btn" class="icon-btn" title="Refresh feeds" aria-label="Refresh feeds">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>
</header>

<nav id="tabs" class="tabs" aria-label="Subreddit tabs"></nav>

<main id="feed" class="feed" aria-live="polite"></main>

<footer class="foot">
  <span>j/k navigate · r refresh · / search · x read · Enter open</span>
  <span class="foot-links"><a href="https://github.com/cksidharthan/rss-cacher" target="_blank" rel="noopener">cached by rss-cacher</a> · <a href="https://here.now" target="_blank" rel="noopener">hosted on here.now</a></span>
</footer>

<script src="app.js?v=6"></script>
</body>
</html>
