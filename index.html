<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>r/Feed — your subreddit reader</title>
<meta name="description" content="A clean RSS reader for your favorite subreddits.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%B0%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<meta property="og:title" content="r Feed Subreddit Reader" />
<meta property="og:description" content="A clean live feed reader for your favorite subreddits via Reddit RSS." />
<meta property="og:url" content="https://jovial-cosmos-amj3.here.now/" />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://here.now/og/jovial-cosmos-amj3.jpg" />
<meta property="og:image:width" content="1280" />
<meta property="og:image:height" content="720" />
<meta name="twitter:image" content="https://here.now/og/jovial-cosmos-amj3.jpg" />
<meta name="twitter:card" content="summary_large_image" /></head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">📰</span><span class="brand-name">r/Feed</span><span class="brand-sub" id="refresh-state">loading…</span></div>
  <div class="topbar-actions">
    <select id="sort-select" aria-label="Sort order">
      <option value="hot">Hot</option>
      <option value="new">New</option>
      <option value="top">Top · day</option>
    </select>
    <button id="refresh-btn" class="icon-btn" title="Refresh feeds" aria-label="Refresh feeds">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>
</header>

<nav id="tabs" class="tabs" aria-label="Subreddit tabs"></nav>

<main id="feed" class="feed" aria-live="polite"></main>

<footer class="foot">
  <span>Feeds via Reddit RSS · proxies keep it working in-browser</span>
  <span class="foot-links"><a href="https://here.now" target="_blank" rel="noopener">hosted on here.now</a></span>
</footer>

<script src="app.js"></script>
</body>
</html>
